# Local Worker smoke test that needs no Cloudflare account or login:
# npm run dev:worker  (offline sample data, template notes, no AI binding)
name = "subs-off-offline"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

[build]
command = "npm run build"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
QLOO_MODE = "fixtures"
QLOO_BASE_URL = "https://hackathon.api.qloo.com"
QLOO_RECORDED_FIRST = "true"
AI_MODE = "off"
